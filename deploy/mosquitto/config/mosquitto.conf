# OFM PoC broker configuration
# Anonymous access refused; per-user topic rules in the acl file
# (Architecture Overview §13). TLS follows in Phase 2.
#
# The password file is generated from deploy/.env by the container at every
# start (see docker-compose.yml), so it is never stored in the repository.

listener 1883
allow_anonymous false
password_file /mosquitto/secure/passwd
acl_file /mosquitto/secure/acl

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
