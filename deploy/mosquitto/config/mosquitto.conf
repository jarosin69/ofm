# OFM broker configuration
# Anonymous access refused; per-user topic rules in the acl file
# (Architecture Overview §13). The password file is generated from
# deploy/.env by the container at every start (see docker-compose.yml), so it
# is never stored in the repository. Login and topic rules apply to both
# listeners alike.

# Plain MQTT: only for the containers of this stack, on Docker's internal
# network (the runtime, the test runner, docker exec mosquitto_sub). Not
# published to the host, so no other computer can reach it.
listener 1883

# MQTT over TLS (ADR-0019, step 2.7): for every client outside the stack -
# MQTT Explorer, SCADA, other systems. Published on the host as port 8883.
# Certificates from the "certs" volume (tools/certs.sh), copied here by the
# container at start; clients trust deploy/certs/ofm-ca.crt.
listener 8883
cafile /mosquitto/secure/ca.crt
certfile /mosquitto/secure/server.crt
keyfile /mosquitto/secure/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/secure/passwd
acl_file /mosquitto/secure/acl

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
