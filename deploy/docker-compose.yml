# OFM Proof of Concept stack
# Usage (from this folder; see README.md):
#   docker run --rm -v "${PWD}:/work" -w /work alpine:3.22 sh make-env.sh
#   docker compose up -d
#
# Image versions are pinned. An upgrade is a deliberate, committed change of a
# version below, never a side effect of "docker compose pull".
# Ports (ADR-0019): other computers reach OFM only through encrypted ports -
# MQTT over TLS on 8883 and HTTPS for Grafana (3000), Mathesar (8080), the
# Node-RED editor (1880) and, with the demo, the simulated line (1881)
# through the "proxy" service. They listen on
# OFM_LISTEN_ADDRESS from .env: 127.0.0.1 (default) = this computer only,
# 0.0.0.0 = the network. The database (5432) and the OPC UA simulator (50000)
# stay on 127.0.0.1 always. Containers reach each other by service name on
# Docker's internal network, unencrypted (that traffic never leaves this
# computer), and Node-RED still reaches PLCs (outbound connections are not
# affected).
name: ofm

services:

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg16
    container_name: ofm-timescaledb
    restart: unless-stopped
    # No outbound connections (step 2.8): TimescaleDB's anonymous usage
    # reports and version checks off, at every start, for old and new volumes.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ofm
      TZ: Etc/UTC                  # ADR-0003: database thinks in UTC
      # Read once by the init script to create the least-privilege roles:
      OFM_RUNTIME_DB_PASSWORD: ${OFM_RUNTIME_DB_PASSWORD:?set OFM_RUNTIME_DB_PASSWORD in .env}
      OFM_CONFIG_DB_PASSWORD: ${OFM_CONFIG_DB_PASSWORD:?set OFM_CONFIG_DB_PASSWORD in .env}
      OFM_READER_DB_PASSWORD: ${OFM_READER_DB_PASSWORD:?set OFM_READER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      # Mounted as a single file so the image's own init scripts (TimescaleDB
      # install and tuning) still run first. Runs only on an empty volume.
      - ./db/init/001-init.sh:/docker-entrypoint-initdb.d/900-ofm-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ofm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending database migrations (ADR-0012), then exits.
  # Runs on every "docker compose up"; Node-RED starts only if it succeeds.
  # Other commands: docker compose run --rm migrate [status|example|erd]
  migrate:
    image: timescale/timescaledb:2.30.2-pg16
    restart: "no"
    entrypoint: ["sh", "/repo/tools/migrate.sh"]
    command: ["up"]
    environment:
      PGHOST: timescaledb
      PGDATABASE: ofm
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Role passwords, set from .env after every migration run (ADR-0012):
      OFM_RUNTIME_DB_PASSWORD: ${OFM_RUNTIME_DB_PASSWORD}
      OFM_CONFIG_DB_PASSWORD: ${OFM_CONFIG_DB_PASSWORD}
      OFM_READER_DB_PASSWORD: ${OFM_READER_DB_PASSWORD}
      OFM_MATHESAR_DB_PASSWORD: ${OFM_MATHESAR_DB_PASSWORD:?run make-env.sh to add OFM_MATHESAR_DB_PASSWORD to .env}
      OFM_DEMO_DB_PASSWORD: ${OFM_DEMO_DB_PASSWORD:-}   # the demo simulator's role, only if the demo is loaded
      OFM_SCREENS_DB_PASSWORD: ${OFM_SCREENS_DB_PASSWORD:?run make-env.sh to add OFM_SCREENS_DB_PASSWORD to .env}
      # Historian retention, set after every run (step 2.5). Lengthening is
      # safe; shortening DELETES the older data at the next daily run.
      OFM_RAW_RETENTION_DAYS: ${OFM_RAW_RETENTION_DAYS:-365}
      OFM_AGG_RETENTION_YEARS: ${OFM_AGG_RETENTION_YEARS:-5}
    volumes:
      - ..:/repo                   # the repository: db/migrations, tools, docs/generated
    depends_on:
      timescaledb:
        condition: service_healthy

  # One-shot: creates or renews the TLS certificates (ADR-0019, tools/certs.sh),
  # then exits. Runs on every "docker compose up", before the broker and the
  # proxy. Keys stay in the "certs" volume; only the public ofm-ca.crt, which
  # clients must trust, is copied to deploy/certs/.
  # Other commands: docker compose run --rm certs [show|import]
  # Uses OFM's Node-RED image, which contains openssl: nothing to download.
  certs:
    image: ofm/node-red:4.1.16-ofm.3
    pull_policy: never
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "/repo/tools/certs.sh"]
    command: ["up"]
    environment:
      # How other computers reach this server (name and IP address,
      # comma-separated); the certificate is valid for exactly these.
      OFM_TLS_NAMES: ${OFM_TLS_NAMES:-}
      OFM_LISTEN_ADDRESS: ${OFM_LISTEN_ADDRESS:-127.0.0.1}    # only reported in the log
    volumes:
      - certs:/certs
      - ..:/repo                   # tools/certs.sh; writes deploy/certs/ofm-ca.crt

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: ofm-mosquitto
    restart: unless-stopped
    environment:
      OFM_MQTT_RUNTIME_PASSWORD: ${OFM_MQTT_RUNTIME_PASSWORD:?set OFM_MQTT_RUNTIME_PASSWORD in .env}
      OFM_MQTT_READER_PASSWORD: ${OFM_MQTT_READER_PASSWORD:?set OFM_MQTT_READER_PASSWORD in .env}
    # At every start, build the password file from .env and copy the ACL into a
    # folder only the broker can read; then start the broker. .env stays the
    # single source of every password. ($$ passes a literal $ to the container.)
    # The folder is emptied first: "docker compose stop/start" and a server
    # restart reuse the container, and Mosquitto 2.1's mosquitto_passwd -c
    # refuses to overwrite an existing file (found in drill X1, step 2.9).
    command:
      - sh
      - -c
      - |
        set -e
        rm -rf /mosquitto/secure
        mkdir -p /mosquitto/secure
        mosquitto_passwd -c -b /mosquitto/secure/passwd ofm_runtime "$$OFM_MQTT_RUNTIME_PASSWORD"
        mosquitto_passwd -b /mosquitto/secure/passwd ofm_reader "$$OFM_MQTT_READER_PASSWORD"
        cp /mosquitto/config/acl /mosquitto/secure/acl
        cp /certs/ca.crt /certs/server.crt /certs/server.key /mosquitto/secure/
        chown -R mosquitto:mosquitto /mosquitto/secure
        chmod 0700 /mosquitto/secure
        chmod 0600 /mosquitto/secure/*
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      # MQTT over TLS for other computers. Plain MQTT (1883) is internal only.
      - "${OFM_LISTEN_ADDRESS:-127.0.0.1}:8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - certs:/certs:ro
      - mosq-data:/mosquitto/data
      - mosq-log:/mosquitto/log
    depends_on:
      certs:
        condition: service_completed_successfully

  nodered:
    # OFM's own image: official Node-RED plus pinned protocol and database
    # nodes (nodered/Dockerfile). Built locally on first start; never pulled.
    build: ./nodered
    image: ofm/node-red:4.1.16-ofm.3
    pull_policy: never
    container_name: ofm-nodered
    restart: unless-stopped
    environment:
      TZ: Australia/Melbourne      # log readability only; data path uses epoch ms UTC
      OFM_RUNTIME_NAME: ofm_runtime_01                 # this instance; sources are assigned to it in the model
      # Flows are code (ADR-0016). FLOWS is the official image's own setting: it
      # is passed to Node-RED on the command line and overrides settings.js.
      FLOWS: /ofm/flows/ofm-runtime.json
      OFM_RUNTIME_DB_USER: ofm_runtime
      NODERED_ADMIN_USER: ${NODERED_ADMIN_USER:?set NODERED_ADMIN_USER in .env}
      NODERED_ADMIN_PASSWORD: ${NODERED_ADMIN_PASSWORD:?set NODERED_ADMIN_PASSWORD in .env}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?set NODE_RED_CREDENTIAL_SECRET in .env}
      # Referenced in flows as ${OFM_RUNTIME_DB_PASSWORD} etc., so no password
      # is ever stored in a flow:
      OFM_RUNTIME_DB_PASSWORD: ${OFM_RUNTIME_DB_PASSWORD}
      OFM_MQTT_RUNTIME_PASSWORD: ${OFM_MQTT_RUNTIME_PASSWORD:?set OFM_MQTT_RUNTIME_PASSWORD in .env}
      # Store-and-forward queue for the historian (ADR-0002): compressed batches
      # in the nodered-data volume while the database cannot be reached.
      OFM_SF_QUEUE_DIR: /data/sfqueue
      OFM_SF_QUEUE_MAX_GB: ${OFM_SF_QUEUE_MAX_GB:-10}
      # Copy of the last model loaded from the database (step 2.6), in the
      # same volume: lets the runtime start while the database is down.
      OFM_MODEL_COPY_DIR: /data/model
    # No ports: the editor is reached through the proxy, https://<server>:1880
    volumes:
      - nodered-data:/data
      - ./nodered/settings.js:/data/settings.js:ro
      - ../flows:/ofm/flows        # the repository's flows folder; Deploy writes here
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.4
    container_name: ofm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?set GRAFANA_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      # No outbound connections (step 2.8): no usage reports, update checks or news.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      OFM_READER_DB_PASSWORD: ${OFM_READER_DB_PASSWORD}   # used by the provisioned datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /ofm/dashboards/ofm-live-data.json
      TZ: Australia/Melbourne      # display layer: local time lives here (ADR-0003)
      GF_SECURITY_COOKIE_SECURE: "true"   # login cookie only over HTTPS (via the proxy)
    # No ports: reached through the proxy, https://<server>:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/ofm/dashboards:ro    # dashboards are code, like flows
    depends_on:
      timescaledb:
        condition: service_healthy

  # Model editor (ADR-0013): a spreadsheet-style web interface on
  # the config tables. Connects to the database as ofm_mathesar or personal
  # logins; its own users and settings live in mathesar-db.
  mathesar:
    image: mathesar/mathesar:0.12.0
    container_name: ofm-mathesar
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "false"
      SECRET_KEY: ${MATHESAR_SECRET_KEY:?run make-env.sh to add MATHESAR_SECRET_KEY to .env}
      DOMAIN_NAME: https://localhost:8080
      # Names Mathesar answers to: this computer, the test runner (mathesar),
      # the proxy, and the server's names from .env. It trusts the proxy's
      # "this was HTTPS" header (production settings), so logins work.
      ALLOWED_HOSTS: localhost,127.0.0.1,mathesar,proxy,${OFM_TLS_NAMES:-}
      POSTGRES_HOST: mathesar-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mathesar_django
      POSTGRES_USER: mathesar
      POSTGRES_PASSWORD: ${MATHESAR_DB_PASSWORD:?run make-env.sh to add MATHESAR_DB_PASSWORD to .env}
    # No ports: reached through the proxy, https://<server>:8080
    volumes:
      - mathesar-static:/code/static
      - mathesar-media:/code/.media
    depends_on:
      mathesar-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # HTTPS front door for the web pages (ADR-0019): Grafana, Mathesar and the
  # Node-RED editor keep their ports, now https:// with OFM's certificate.
  # Starts without waiting for them; a page that is not up yet shows 502.
  proxy:
    image: caddy:2.11.7-alpine
    container_name: ofm-proxy
    restart: unless-stopped
    ports:
      - "${OFM_LISTEN_ADDRESS:-127.0.0.1}:3000:3000"    # Grafana
      - "${OFM_LISTEN_ADDRESS:-127.0.0.1}:8080:8080"    # Mathesar
      - "${OFM_LISTEN_ADDRESS:-127.0.0.1}:1880:1880"    # Node-RED editor
      - "${OFM_LISTEN_ADDRESS:-127.0.0.1}:1881:1881"    # simulated line (demo profile); 502 when it is not running
      - "${OFM_LISTEN_ADDRESS:-127.0.0.1}:1882:1882"    # operator screens: line view at /dashboard
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certs:/certs:ro
      - proxy-data:/data
    depends_on:
      certs:
        condition: service_completed_successfully

  # Mathesar's own settings database (its users and saved views; no plant
  # data). Same image as the main database, so nothing extra to download.
  mathesar-db:
    image: timescale/timescaledb:2.30.2-pg16
    container_name: ofm-mathesar-db
    restart: unless-stopped
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]   # as timescaledb
    environment:
      POSTGRES_DB: mathesar_django
      POSTGRES_USER: mathesar
      POSTGRES_PASSWORD: ${MATHESAR_DB_PASSWORD}
      TZ: Etc/UTC
    volumes:
      - mathesar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathesar -d mathesar_django"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OPC UA simulator: the Phase 1 data source (Microsoft OPC PLC, MIT licence).
  # Runs only when COMPOSE_PROFILES in .env contains "simulator".
  # Inside the stack it is opc.tcp://opcplc:50000; from this laptop (e.g. with
  # a desktop OPC UA client) opc.tcp://localhost:50000.
  opcplc:
    image: mcr.microsoft.com/iotedge/opc-plc:2.15.11
    container_name: ofm-opcplc
    hostname: opcplc
    restart: unless-stopped
    profiles: ["simulator"]
    command:
      - --pn=50000          # OPC UA port
      - --autoaccept        # trust client certificates (simulator only)
      - --ut                # allow unencrypted connections (simulator only)
    ports:
      - "127.0.0.1:50000:50000"

  # Load-test data source (step 2.9): a second OPC PLC simulator with
  # OFM_LOAD_VALUES fast nodes (FastUInt1 ... FastUIntN), each changing once a
  # second, for the load-test line (docker compose run --rm migrate loadtest).
  # Runs only with: docker compose --profile loadtest up -d
  # Stop it afterwards: docker compose --profile loadtest stop opcplc-load
  opcplc-load:
    image: mcr.microsoft.com/iotedge/opc-plc:2.15.11
    container_name: ofm-opcplc-load
    hostname: opcplc-load
    restart: "no"
    profiles: ["loadtest"]
    command:
      - --pn=50000
      - --autoaccept
      - --ut
      - --fn=${OFM_LOAD_VALUES:-2000}   # number of fast nodes = values per second
      - --fr=1                          # each changes once a second
      - --ft=uint

  # Operator screens (ADR-0027): a second Node-RED from OFM's own image,
  # separate from the runtime as an HMI is from the PLC, so a screen can never
  # stall data collection. The line view is https://<server>:1882/dashboard
  # (through the proxy); its editor https://<server>:1882. Live values from
  # the UNS as the read-only MQTT user; everything it reads from or records
  # in the database goes through the functions granted to ofm_screens
  # (migration 018). People sign in with employee number and PIN (ADR-0028).
  screens:
    image: ofm/node-red:4.1.16-ofm.3
    pull_policy: never
    container_name: ofm-screens
    restart: unless-stopped
    environment:
      TZ: Australia/Melbourne      # log readability only; the screens show times in the browser's local time
      FLOWS: /ofm/flows/ofm-screens.json                # the screens' flows (ADR-0016); Deploy writes here
      OFM_SCREEN_IDLE_MINUTES: ${OFM_SCREEN_IDLE_MINUTES:-5}   # signed out after this long untouched
      OFM_SCREENS_DB_PASSWORD: ${OFM_SCREENS_DB_PASSWORD:?run make-env.sh to add OFM_SCREENS_DB_PASSWORD to .env}
      OFM_MQTT_READER_PASSWORD: ${OFM_MQTT_READER_PASSWORD:?set OFM_MQTT_READER_PASSWORD in .env}
      NODERED_ADMIN_USER: ${NODERED_ADMIN_USER:?set NODERED_ADMIN_USER in .env}
      NODERED_ADMIN_PASSWORD: ${NODERED_ADMIN_PASSWORD:?set NODERED_ADMIN_PASSWORD in .env}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?set NODE_RED_CREDENTIAL_SECRET in .env}
    volumes:
      - screens-data:/data
      - ./nodered/settings.js:/data/settings.js:ro      # the same settings as OFM's runtime
      - ../flows:/ofm/flows
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  # Simulated packing line, OFM's demo (ADR-0023, demo/packing-line/README.md):
  # a second Node-RED from OFM's own image that plays the plant - six machines,
  # each a simulated OPC UA PLC (opc.tcp://linesim:4841 ... 4846). OFM reads
  # it like any plant. Runs only when COMPOSE_PROFILES in .env contains "demo".
  # Its editor (and, from step 3a.1 part 2, its control panel) is
  # https://<server>:1881 through the proxy; the OPC UA ports are open to this
  # computer only, for a desktop OPC UA client.
  linesim:
    image: ofm/node-red:4.1.16-ofm.3
    pull_policy: never
    container_name: ofm-linesim
    hostname: linesim
    restart: unless-stopped
    profiles: ["demo"]
    environment:
      TZ: Australia/Melbourne      # log readability only; the shift pattern uses line.json's time zone
      FLOWS: /demo/linesim-flows.json                  # the simulator's flows (ADR-0016); Deploy writes here
      OFM_LINESIM_CONFIG: /demo/line.json               # the line: machines, speeds, failures, products
      OFM_LINESIM_PKI_DIR: /data/linesim-pki            # the simulated PLCs' OPC UA certificates
      # Work orders (step 3a.5): reads .../workorder as OFM's read-only MQTT
      # user; starts orders through the demo's database functions (role ofm_demo).
      OFM_MQTT_READER_PASSWORD: ${OFM_MQTT_READER_PASSWORD:?set OFM_MQTT_READER_PASSWORD in .env}
      OFM_DEMO_DB_PASSWORD: ${OFM_DEMO_DB_PASSWORD:-}
      NODERED_ADMIN_USER: ${NODERED_ADMIN_USER:?set NODERED_ADMIN_USER in .env}
      NODERED_ADMIN_PASSWORD: ${NODERED_ADMIN_PASSWORD:?set NODERED_ADMIN_PASSWORD in .env}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?set NODE_RED_CREDENTIAL_SECRET in .env}
    ports:
      - "127.0.0.1:4841-4846:4841-4846"                 # OPC UA, one port per machine (this computer only)
    volumes:
      - linesim-data:/data
      - ./nodered/settings.js:/data/settings.js:ro      # the same settings as OFM's runtime
      - ../demo/packing-line:/demo                      # flows and line.json from the repository

  # Automated tests (tests/README.md). Never started by "up"; run with
  #   docker compose run --rm test              all suites
  #   docker compose run --rm test offline      no running stack needed
  # Uses OFM's own Node-RED image and the libraries in it, so it needs no
  # internet. The repository is mounted read-only: tests change nothing.
  test:
    image: ofm/node-red:4.1.16-ofm.3
    pull_policy: never
    profiles: ["test"]
    restart: "no"
    entrypoint: ["node", "/repo/tests/run.js"]
    command: ["all"]
    working_dir: /repo
    environment:
      OFM_RUNTIME_NAME: ofm_runtime_01
      # Database tests act as each role from the administrator login; every
      # test runs in a transaction that is rolled back.
      PGHOST: timescaledb
      PGDATABASE: ofm
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # The live check uses the read-only logins, like any consumer:
      OFM_READER_DB_PASSWORD: ${OFM_READER_DB_PASSWORD}
      OFM_MQTT_READER_PASSWORD: ${OFM_MQTT_READER_PASSWORD}
      GRAFANA_USER: ${GRAFANA_USER}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD}
      OFM_TLS_NAMES: ${OFM_TLS_NAMES:-}
    volumes:
      - ..:/repo:ro
      - certs:/certs:ro            # the public certificates, to check TLS

volumes:
  tsdb-data:
  mosq-data:
  mosq-log:
  nodered-data:
  grafana-data:
  mathesar-static:
  mathesar-media:
  mathesar-pgdata:
  certs:                           # TLS keys and certificates (tools/certs.sh)
  proxy-data:
  linesim-data:                    # the simulator's Node-RED data (demo profile)
  screens-data:                    # the operator screens' Node-RED data
