<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" role="img" aria-labelledby="stTitle stDesc">
        <title id="stTitle">Where Caddy sits in the OFM stack</title>
        <desc id="stDesc">Remote visitors pass Cloudflare and come down the tunnel to cloudflared on the OFM computer; local visitors come straight from the local network. Both reach Caddy, which forwards by port to Grafana, Mathesar, Node-RED, the simulator and the operator screens. Below are TimescaleDB and Mosquitto, which are not behind Caddy. PLCs at the bottom are only read by Node-RED.</desc>
<style>
  text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #16202a; }
  .t-sm { font-size: 12px; } .t-md { font-size: 14px; }
  .t-lg { font-size: 17px; font-weight: 600; }
  .t-mono { font-family: Consolas, Menlo, monospace; font-size: 12px; }
  .t-muted { fill: #586572; } .t-accent { fill: #0a6b86; } .t-gate { fill: #b86a00; }
  .box { fill: #ffffff; stroke: #d3dae0; stroke-width: 1.5; }
  .box-accent { fill: #dcecf1; stroke: #0a6b86; stroke-width: 1.5; }
  .box-gate { fill: #fbeedb; stroke: #b86a00; stroke-width: 1.5; }
  .box-good { fill: #e0f1e6; stroke: #2b7a4b; stroke-width: 1.5; }
  .box-bg { fill: #f3f5f6; stroke: #d3dae0; stroke-width: 1.5; }
  .ln { stroke: #16202a; stroke-width: 1.6; fill: none; }
  .ln-accent { stroke: #0a6b86; stroke-width: 2; fill: none; }
  .wall { fill: #16202a; }
  .head-fg { fill: #16202a; } .head-accent { fill: #0a6b86; }
</style>
<rect x="0" y="0" width="900" height="780" fill="#ffffff"/>
        <defs>
          <marker id="kh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-fg"/></marker>
          <marker id="kha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker>
        </defs>

        <!-- Remote side -->
        <rect x="30" y="14" width="210" height="54" rx="8" class="box"/>
        <text x="135" y="38" text-anchor="middle" class="t-md" font-weight="600">Remote visitor</text>
        <text x="135" y="56" text-anchor="middle" class="t-sm t-muted">phone or laptop, anywhere</text>
        <line x1="135" y1="70" x2="135" y2="94" class="ln" marker-end="url(#kh)"/>
        <text x="145" y="87" class="t-mono t-accent">HTTPS</text>
        <rect x="30" y="98" width="210" height="62" rx="8" class="box-gate"/>
        <text x="135" y="123" text-anchor="middle" class="t-md t-gate" font-weight="600">Cloudflare</text>
        <text x="135" y="142" text-anchor="middle" class="t-sm">DNS · Access login</text>

        <!-- Router bar -->
        <rect x="10" y="190" width="880" height="7" class="wall"/>
        <text x="880" y="182" text-anchor="end" class="t-sm" font-weight="600">Router / firewall: no incoming ports open</text>

        <!-- Local side -->
        <rect x="560" y="214" width="300" height="54" rx="8" class="box"/>
        <text x="710" y="237" text-anchor="middle" class="t-md" font-weight="600">Local network</text>
        <text x="710" y="255" text-anchor="middle" class="t-sm t-muted">plant PCs, panel PCs, laptops</text>

        <!-- TBOX frame -->
        <rect x="10" y="290" width="880" height="400" rx="12" class="box-bg"/>
        <text x="30" y="316" class="t-lg">OFM computer (TBOX) · Docker</text>

        <!-- tunnel line -->
        <line x1="135" y1="336" x2="135" y2="164" class="ln-accent" marker-end="url(#kha)"/>
        <text x="146" y="236" class="t-sm t-accent">tunnel, opened</text>
        <text x="146" y="252" class="t-sm t-accent">from inside</text>

        <rect x="40" y="338" width="190" height="48" rx="6" class="box-accent"/>
        <text x="135" y="359" text-anchor="middle" class="t-md" font-weight="600">cloudflared</text>
        <text x="135" y="376" text-anchor="middle" class="t-sm t-muted">4 routes, selected paths</text>
        <line x1="135" y1="388" x2="135" y2="422" class="ln" marker-end="url(#kh)"/>
        <text x="146" y="410" class="t-sm">HTTPS, certificate checked</text>

        <line x1="710" y1="270" x2="710" y2="422" class="ln" marker-end="url(#kh)"/>
        <text x="720" y="356" class="t-mono t-accent">HTTPS</text>

        <!-- Caddy -->
        <rect x="40" y="426" width="830" height="76" rx="8" class="box-accent"/>
        <text x="60" y="450" class="t-lg">Caddy (“proxy”) · HTTPS front door, OFM certificate</text>
        <rect x="65" y="462" width="100" height="26" rx="13" class="box-good"/><text x="115" y="480" text-anchor="middle" class="t-mono">:3000</text>
        <rect x="235" y="462" width="100" height="26" rx="13" class="box-good"/><text x="285" y="480" text-anchor="middle" class="t-mono">:8080</text>
        <rect x="405" y="462" width="100" height="26" rx="13" class="box"/><text x="455" y="480" text-anchor="middle" class="t-mono">:1880</text>
        <rect x="575" y="462" width="100" height="26" rx="13" class="box-good"/><text x="625" y="480" text-anchor="middle" class="t-mono">:1881</text>
        <rect x="745" y="462" width="100" height="26" rx="13" class="box-good"/><text x="795" y="480" text-anchor="middle" class="t-mono">:1882</text>

        <!-- to apps -->
        <line x1="115" y1="504" x2="115" y2="530" class="ln" marker-end="url(#kh)"/>
        <line x1="285" y1="504" x2="285" y2="530" class="ln" marker-end="url(#kh)"/>
        <line x1="455" y1="504" x2="455" y2="530" class="ln" marker-end="url(#kh)"/>
        <line x1="625" y1="504" x2="625" y2="530" class="ln" marker-end="url(#kh)"/>
        <line x1="795" y1="504" x2="795" y2="530" class="ln" marker-end="url(#kh)"/>
        
        <rect x="42" y="534" width="146" height="56" rx="6" class="box"/>
        <text x="115" y="567" text-anchor="middle" class="t-md" font-weight="600">Grafana</text>
        <rect x="212" y="534" width="146" height="56" rx="6" class="box"/>
        <text x="285" y="567" text-anchor="middle" class="t-md" font-weight="600">Mathesar</text>
        <rect x="382" y="534" width="146" height="56" rx="6" class="box"/>
        <text x="455" y="557" text-anchor="middle" class="t-md" font-weight="600">Node-RED</text>
        <text x="455" y="576" text-anchor="middle" class="t-sm t-muted">runtime + editor</text>
        <rect x="552" y="534" width="146" height="56" rx="6" class="box"/>
        <text x="625" y="557" text-anchor="middle" class="t-md" font-weight="600">Simulator</text>
        <text x="625" y="576" text-anchor="middle" class="t-sm t-muted">demo only</text>
        <rect x="722" y="534" width="146" height="56" rx="6" class="box"/>
        <text x="795" y="557" text-anchor="middle" class="t-md" font-weight="600">Operator</text>
        <text x="795" y="576" text-anchor="middle" class="t-sm t-muted">screens</text>

        <text x="455" y="608" text-anchor="middle" class="t-sm t-muted">Applications speak plain HTTP, only inside the box</text>

        <!-- data -->
        <rect x="42" y="620" width="316" height="56" rx="6" class="box"/>
        <text x="200" y="643" text-anchor="middle" class="t-md" font-weight="600">TimescaleDB</text>
        <text x="200" y="662" text-anchor="middle" class="t-sm t-muted">model + history · no outside port</text>
        <rect x="552" y="620" width="316" height="56" rx="6" class="box"/>
        <text x="710" y="643" text-anchor="middle" class="t-md" font-weight="600">Mosquitto (UNS)</text>
        <text x="710" y="662" text-anchor="middle" class="t-sm t-muted">own TLS on 8883, not via Caddy</text>

        <!-- PLCs -->
        <rect x="350" y="714" width="210" height="50" rx="8" class="box"/>
        <text x="455" y="735" text-anchor="middle" class="t-md" font-weight="600">PLCs / OPC UA</text>
        <text x="455" y="753" text-anchor="middle" class="t-sm t-muted">own network segment</text>
        <line x1="455" y1="712" x2="455" y2="616" class="ln" marker-end="url(#kh)"/>
        <text x="465" y="700" class="t-sm">OFM reads only</text>

        <!-- legend -->
        <rect x="560" y="712" width="22" height="14" rx="7" class="box-good"/>
        <text x="590" y="724" class="t-sm">reachable locally and through the tunnel</text>
        <rect x="560" y="740" width="22" height="14" rx="7" class="box"/>
        <text x="590" y="752" class="t-sm">local network only (Node-RED editor)</text>
      </svg>
